<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" fill="none">
  <defs>
    <linearGradient id="embGrad" x1="0" y1="0" x2="320" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16191f"/>
      <stop offset="1" stop-color="#20242e"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="8" fill="url(#embGrad)" stroke="#303544" stroke-width="1.5"/>
  <!-- Circuit traces -->
  <path d="M20 40 H80 L100 60 H180" stroke="#e58a4e" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="180" cy="60" r="3" fill="#e58a4e" fill-opacity="0.6"/>
  <path d="M20 140 H60 L80 120 H240" stroke="#e58a4e" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="240" cy="120" r="3" fill="#e58a4e" fill-opacity="0.6"/>
  <!-- Chip Icon -->
  <rect x="135" y="45" width="50" height="50" rx="6" fill="#1b1e26" stroke="#e58a4e" stroke-width="1.8"/>
  <rect x="147" y="57" width="26" height="26" rx="3" fill="#e58a4e" fill-opacity="0.2"/>
  <circle cx="160" cy="70" r="4" fill="#e58a4e"/>
  <!-- Pins -->
  <line x1="145" y1="37" x2="145" y2="45" stroke="#e58a4e" stroke-width="1.6"/>
  <line x1="160" y1="37" x2="160" y2="45" stroke="#e58a4e" stroke-width="1.6"/>
  <line x1="175" y1="37" x2="175" y2="45" stroke="#e58a4e" stroke-width="1.6"/>
  <line x1="145" y1="95" x2="145" y2="103" stroke="#e58a4e" stroke-width="1.6"/>
  <line x1="160" y1="95" x2="160" y2="103" stroke="#e58a4e" stroke-width="1.6"/>
  <line x1="175" y1="95" x2="175" y2="103" stroke="#e58a4e" stroke-width="1.6"/>
  <!-- Label -->
  <text x="160" y="128" fill="#f0f2f5" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Embedded Systems</text>
  <text x="160" y="148" fill="#a6adb9" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">ARM Cortex-M • Microcontrollers</text>
</svg>
